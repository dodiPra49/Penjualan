# ==============================================================================
# Supervisor Configuration untuk Laravel Queue Worker
# Simpan di: /etc/supervisor/conf.d/laravel-worker.conf
# Jalankan:
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start laravel-worker:*
# ==============================================================================

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/penjualan/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/penjualan/storage/logs/worker.log
stopwaitsecs=3600
