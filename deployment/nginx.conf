# ==============================================================================
# Nginx Virtual Host Configuration untuk Laravel
# Simpan di: /etc/nginx/sites-available/penjualan.conf
# Lalu aktifkan: ln -s /etc/nginx/sites-available/penjualan.conf /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com; # Ganti dengan domain atau IP VPS Anda

    # Lokasi root mengarah ke folder public Laravel
    root /var/www/penjualan/public;
    index index.php index.html index.htm;

    charset utf-8;

    # Pengaturan ukuran upload maksimal
    client_max_body_size 64M;

    # Header Keamanan
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
    
    location = /robots.txt  { 
        access_log off; 
        log_not_found off; 
    }

    error_page 404 /index.php;

    # Handle PHP Scripts via PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock; # Sesuaikan versi PHP jika menggunakan 8.2 atau 8.3
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Blok akses ke file sensitif (.env, .git, dll)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache untuk static assets (Vite build, images, css, js)
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|tiff|ttf|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
