name: Laravel CI/CD to Linux VPS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests & Build (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, pdo_mysql, bcmath, redis, zip
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Execute Tests (PHPUnit)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test

  deploy:
    name: Deploy to Linux VPS (CD)
    needs: [test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Deployment Secrets
        run: |
          MISSING=0
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "::error::Secret 'SSH_HOST' belum diset di GitHub Secrets! Harap isi IP Publik atau domain VPS Anda."
            MISSING=1
          fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "::error::Secret 'SSH_USER' belum diset di GitHub Secrets! Harap isi username SSH VPS Anda (misal: ubuntu, deployer, root)."
            MISSING=1
          fi
          if [ -z "${{ secrets.SSH_KEY }}" ] && [ -z "${{ secrets.SSH_PASSWORD }}" ]; then
            echo "::error::Belum ada metode autentikasi! Harap buat salah satu secret: 'SSH_KEY' (Private Key SSH) atau 'SSH_PASSWORD' (Password SSH VPS)."
            MISSING=1
          fi
          if [ $MISSING -eq 1 ]; then
            echo "❌ Konfigurasi GitHub Secrets belum lengkap. Buka repo GitHub -> Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: WORK_DIR
          script: |
            set -e
            TARGET_DIR="${{ secrets.WORK_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/var/www/penjualan"
            fi

            echo "🚀 [CI/CD] Starting Deployment to VPS in $TARGET_DIR..."
            echo "👤 SSH User: $(whoami)"

            # Export PATH standar agar php, composer, node terbaca di non-interactive shell
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$HOME/.composer/vendor/bin:$PATH"

            # 1. Pastikan direktori target ada
            if [ ! -d "$TARGET_DIR" ]; then
              echo "📁 Direktori $TARGET_DIR belum ada, membuat direktori..."
              mkdir -p "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "📍 Direktori aktif: $(pwd)"

            # 2. Perbaiki izin akses direktori jika sebelumnya diubah oleh root/www-data
            if [ ! -w "$TARGET_DIR" ] || [ -d ".git" -a ! -w ".git" ]; then
              echo "🔧 Memperbaiki izin akses direktori untuk user $(whoami)..."
              sudo chown -R $(whoami):www-data "$TARGET_DIR" 2>/dev/null || sudo chown -R $(whoami):$(whoami) "$TARGET_DIR" 2>/dev/null || true
              sudo chmod -R 775 "$TARGET_DIR" 2>/dev/null || true
            fi

            # 3. Atur Git safe.directory dan bersihkan sisa file lock
            git config --global --add safe.directory "*" 2>/dev/null || true
            rm -f .git/*.lock .git/refs/heads/*.lock .git/FETCH_HEAD.lock 2>/dev/null || true

            # 4. Cek apakah direktori sudah merupakan Git repository
            if [ ! -d ".git" ]; then
              echo "📦 Folder belum berisi git repository. Melakukan git clone awal..."
              git clone https://github.com/dodiPra49/Penjualan.git .
            else
              echo "📥 Memperbarui kode dari branch main..."
              git fetch origin main || (sudo chown -R $(whoami) .git && git fetch origin main)
              git reset --hard origin/main
            fi

            # 5. Jalankan script deploy via bash (bebas masalah permission chmod & CRLF)
            if [ -f "./deploy.sh" ]; then
              echo "⚡ Menjalankan deploy.sh..."
              sed -i 's/\r$//' ./deploy.sh 2>/dev/null || true
              bash ./deploy.sh
            else
              echo "⚠️ deploy.sh tidak ditemukan, menjalankan instruksi default..."
              [ ! -f ".env" ] && cp .env.example .env && php artisan key:generate || true
              composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
              if command -v npm &> /dev/null; then
                npm ci --silent 2>/dev/null || npm install --silent 2>/dev/null || true
                npm run build --silent 2>/dev/null || true
              fi
              php artisan migrate --force 2>/dev/null || echo "⚠️ Migrasi database dilewati."
              php artisan optimize:clear
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              php artisan storage:link 2>/dev/null || true
              php artisan queue:restart 2>/dev/null || true
              sudo systemctl reload php8.1-fpm 2>/dev/null || sudo systemctl reload php8.2-fpm 2>/dev/null || true
              echo "✅ Deployment selesai!"
            fi
